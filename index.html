<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Unicórnio da Rafaela</title>
<meta name="description" content="Jogo de unicórnio: colorir, quebra-cabeças, formas e letras.">
<meta name="theme-color" content="#E4F5EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unicórnio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one-screen sticker-book app. Home -> Colorir / Quebra-cabeça (via gallery) / Formas / Letras. */
:root{
  --ink:#3B2A4A;
  --bg:#E4F5EF;
  --card:#FFFFFF;
  --pink:#FF5FA2;
  --sun:#FFD23F;
  --sky:#5BC0EB;
  --mint:#9BE3C9;
  --ok:#8CE99A;
  --lilac:#FFD1E5;
  --ink-soft:rgba(59,42,74,.22);
  --display:"Baloo 2","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --letter:"Andika","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;margin:0}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,95,162,.20) 0 3px, transparent 4px),
    radial-gradient(circle at 70% 60%, rgba(91,192,235,.22) 0 4px, transparent 5px),
    radial-gradient(circle at 45% 85%, rgba(255,210,63,.30) 0 3px, transparent 4px);
  background-size:130px 130px, 170px 170px, 110px 110px;
  color:var(--ink);
  font-family:var(--display);
  padding-left:max(12px, env(safe-area-inset-left, 0px));
  padding-right:max(12px, env(safe-area-inset-right, 0px));
  padding-top:max(8px, env(safe-area-inset-top, 0px));
  padding-bottom:max(8px, env(safe-area-inset-bottom, 0px));
  overscroll-behavior:none;
  box-sizing:border-box;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{height:100%;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px}
button{font-family:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.dc{pointer-events:none}

/* buttons */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-height:46px;flex:none}
.grow{flex:1;min-width:0}
.btn{
  flex:none;width:46px;height:46px;border-radius:15px;border:3px solid var(--ink);
  background:var(--card);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0;
  transition:transform .08s, box-shadow .08s;
}
.btn:active,.big:active,.sw:active,.gth:active,.tile:active,.pic:active,.lc:active,.act:active,.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn svg{width:26px;height:26px}
.btn.yellow{background:var(--sun)}
.btn.pinkb{background:var(--lilac)}
.btn.on{background:var(--sun)}
.ttl{font-weight:800;font-size:clamp(20px,5vw,28px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* home */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-bottom:6px}
.side{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.uni{flex:1 1 auto;min-height:90px;max-height:320px;width:100%;background:none;border:0;padding:0;position:relative;display:flex;justify-content:center}
.uni svg.art{height:100%;width:auto;aspect-ratio:222/198;max-width:100%;overflow:visible;animation:bob 3s ease-in-out infinite;transform-origin:50% 100%}
.uni.hop svg.art{animation:hop .6s ease-out}
.twk{position:absolute;width:22px;height:22px;color:var(--sun);animation:twk 2.4s ease-in-out infinite;pointer-events:none}
.twk:nth-of-type(2){color:var(--pink);animation-delay:.8s}
.twk:nth-of-type(3){color:var(--sky);animation-delay:1.6s}
h1{margin:0;text-align:center;font-weight:800;line-height:1;font-size:clamp(24px,6vw,48px);text-wrap:balance}
h1 .name{display:block;color:var(--pink);font-size:1.45em;text-shadow:3px 3px 0 var(--ink);letter-spacing:.01em}
h1 .sub{display:block;font-size:.6em;margin-top:6px}
.players{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{
  font-family:var(--display);font-weight:800;font-size:18px;line-height:1;padding:9px 16px;border-radius:999px;
  border:3px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);flex:none;white-space:nowrap
}
.chip.on{background:var(--pink);color:#fff}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
.big{
  display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;
  font-size:clamp(17px,4.6vw,26px);font-weight:800;line-height:1.05;padding:10px 10px;border-radius:22px;border:3px solid var(--ink);
  box-shadow:0 5px 0 var(--ink);transition:transform .08s, box-shadow .08s;text-align:left
}
.big svg{width:42px;height:42px;flex:none}
.big.paint{background:var(--sun)}
.big.puzzle{background:var(--sky)}
.big.shapes{background:var(--mint)}
.big.letters{background:var(--lilac)}

/* gallery */
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 20px;overscroll-behavior:contain}
.scroll h3{margin:10px 2px 8px;font-size:20px;font-weight:800;letter-spacing:.02em}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.gth{position:relative;border:3px solid var(--ink);border-radius:14px;padding:0;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--ink);aspect-ratio:4/3}
.gth img{display:block;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:4px;right:4px;display:flex;align-items:center;gap:2px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:1px 7px 1px 3px;font-weight:800;font-size:14px;line-height:1.2}
.badge svg{width:18px;height:18px;color:var(--sun)}

/* paint */
.art{flex:1;min-height:0;min-width:0;container-type:size;display:flex;align-items:center;justify-content:center}
.frame{
  position:relative;width:min(100cqw, calc(100cqh * 4 / 3));aspect-ratio:4/3;max-width:100%;
  background:var(--card);border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 var(--ink);
}
#canvasHost{position:absolute;inset:0;touch-action:none}
#canvasHost svg{display:block;width:100%;height:100%}
.zoombar{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:2}
.zoombar .btn{width:40px;height:40px;border-radius:12px;opacity:.92}
.zoombar .btn svg{width:22px;height:22px}
.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:400px;margin:0 auto;padding-bottom:4px;flex:none}
.sw{
  width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);padding:0;box-shadow:0 3px 0 var(--ink);
  transition:transform .12s, box-shadow .12s;flex:none
}
.sw.on{transform:scale(1.16);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.sw.rainbow{background:conic-gradient(#FF6B6B,#FFA94D,#FFE066,#8CE99A,#74C0FC,#B197FC,#FF6B6B)}
.tool{border-radius:12px;background:var(--card);display:grid;place-items:center}
.tool svg{width:24px;height:24px}
.tool.on{background:var(--sun);transform:none;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.tool.last{margin-right:8px}

/* puzzle + shapes */
.stage{flex:1;min-height:0;position:relative;touch-action:none}
.board{position:absolute;background:var(--card);border-radius:6px;outline:3px solid var(--ink);outline-offset:3px;box-shadow:0 8px 0 3px var(--ink)}
.board img{position:absolute;inset:0;width:100%;height:100%;opacity:.2;pointer-events:none}
.board .grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(to right, var(--ink-soft) 2px, transparent 2px),linear-gradient(to bottom, var(--ink-soft) 2px, transparent 2px)}
.board.done{animation:glow 1s ease-in-out 2}
.shboard{border-radius:20px;outline:none;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.tray{position:absolute;border:3px dashed var(--ink-soft);border-radius:18px;background:rgba(255,255,255,.4)}
.pc{
  position:absolute;left:0;top:0;border-radius:7px;background-repeat:no-repeat;
  box-shadow:0 0 0 3px #fff,0 6px 0 2px rgba(59,42,74,.35);touch-action:none;cursor:grab;z-index:2;
}
.pc.drag{cursor:grabbing;box-shadow:0 0 0 3px #fff,0 14px 18px rgba(59,42,74,.35)}
.pc.lock{border-radius:0;box-shadow:none;z-index:1;pointer-events:none;transition:transform .15s ease-out}
.pc.snap{animation:snap .35s ease-out}
.sil,.shp{position:absolute;left:0;top:0}
.sil svg,.shp svg{display:block;width:100%;height:100%;overflow:visible}
.shp{touch-action:none;cursor:grab;z-index:2;filter:drop-shadow(0 5px 0 rgba(59,42,74,.3))}
.shp.drag{z-index:50;filter:drop-shadow(0 12px 10px rgba(59,42,74,.35))}
.shp.home{transition:transform .25s ease-out}
.shp.lock{pointer-events:none;filter:none;z-index:1;transition:transform .15s ease-out}
.mg{display:grid;gap:2px;width:26px;height:26px}
.mg i{background:var(--pink);border-radius:2px}

/* letters */
.acts{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:14px;max-width:620px;max-height:520px;width:100%;margin:auto;padding-bottom:6px}
.act{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0;
  border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:12px 8px;
  font-weight:800;font-size:clamp(17px,4.5vw,24px);line-height:1.05
}
.act .ic{font-family:var(--letter);font-weight:700;font-size:clamp(30px,min(11vw,10vh),64px);line-height:1;white-space:nowrap}
.act{overflow:hidden;text-align:center}
.act.a1{background:var(--sun)}.act.a2{background:var(--sky)}.act.a3{background:var(--mint)}.act.a4{background:var(--lilac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;min-width:0;flex:1}
.namebar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;flex:none}
.lb{min-width:34px;height:42px;padding:0 4px;border:3px solid var(--ink);border-radius:10px;display:grid;place-items:center;background:var(--card);font-family:var(--letter);font-weight:700;font-size:26px;line-height:1}
.lb.cur{background:var(--sun);transform:scale(1.12)}
.lb.ok{background:var(--ok)}
.tracebox{flex:1;min-height:0;position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);overflow:hidden}
.tracebox canvas{position:absolute;inset:0;width:100%;height:100%}
#tInk{touch-action:none}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;flex:none;padding-top:6px}
.slot{width:clamp(36px,11vw,56px);height:clamp(46px,13vw,66px);border:3px dashed var(--ink);border-radius:12px;display:grid;place-items:center;
  font-family:var(--letter);font-weight:700;font-size:clamp(26px,8vw,40px);line-height:1;color:rgba(59,42,74,.22);background:rgba(255,255,255,.6)}
.slot.next{border-color:var(--pink);border-style:solid;box-shadow:0 0 0 4px rgba(255,95,162,.25)}
.slot.f{border-style:solid;background:var(--ok);color:var(--ink)}
.tiles{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:center}
.tile{width:clamp(60px,19vw,84px);height:clamp(60px,19vw,84px);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);
  font-family:var(--letter);font-weight:700;font-size:clamp(34px,11vw,50px);line-height:1;padding:0}
.tile.gone{visibility:hidden}
.shake{animation:shake .4s}
.wordrow{display:flex;align-items:center;justify-content:center;gap:12px;flex:none;flex-wrap:wrap}
.word{font-family:var(--letter);font-weight:700;font-size:clamp(44px,14vw,92px);line-height:1.05;letter-spacing:.04em;display:flex}
.syl:nth-child(odd){color:#E0337E}.syl:nth-child(even){color:#1C7FB6}
.pics{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:12px;align-content:center;max-width:620px;width:100%;margin:0 auto;padding-bottom:6px}
@media (orientation:portrait){.pics{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr));justify-items:center}.pic{height:100%;width:auto;max-height:210px}}
.pic{aspect-ratio:1;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);background:var(--card);padding:8%;min-width:0;max-height:100%}
.pic img{display:block;width:100%;height:100%}
.pic.right{background:var(--ok)}
.pic.wrong{opacity:.35}
.fpic{flex:1;min-height:0;display:flex;justify-content:center}
.fpic img{height:100%;max-width:100%;aspect-ratio:1;background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:3%}
.blank{display:inline-block;min-width:.75em;border-bottom:6px solid var(--ink);color:transparent;margin-right:.04em}
.blank.ok{color:#2B8A3E;border-bottom-color:#2B8A3E}
.lcs{display:flex;gap:16px;justify-content:center;flex:none;padding-bottom:6px}
.lc{width:clamp(70px,22vw,96px);height:clamp(70px,22vw,96px);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);background:var(--card);
  font-family:var(--letter);font-weight:700;font-size:clamp(40px,13vw,60px);line-height:1;padding:0}
.lc.right{background:var(--ok)}.lc.wrong{opacity:.35}
.prog{display:flex;gap:3px}
.prog svg{width:24px;height:24px;color:#E5DEEB}
.prog svg.on{color:var(--sun)}

/* modals */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(59,42,74,.45);padding:16px}
.card{
  background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);
  padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:420px;width:100%;text-align:center;max-height:100%;overflow:auto
}
.card h2{margin:0;font-size:clamp(26px,7vw,38px);line-height:1.05;font-weight:800;text-wrap:balance}
.card h2 b{color:var(--pink)}
.card img{width:100%;border-radius:12px;border:3px solid var(--ink)}
.winword{font-family:var(--letter);font-weight:700;font-size:clamp(36px,11vw,60px);color:var(--pink);letter-spacing:.05em;line-height:1}
.row{display:flex;gap:16px;justify-content:center}
.btn.xl{width:72px;height:72px;border-radius:22px}
.btn.xl svg{width:40px;height:40px}
.btn.ok{background:var(--ok)}
.btn.no{background:#FFB3B3}
.stars{display:flex;gap:6px}
.stars svg{width:44px;height:44px;color:var(--sun);animation:pop .5s ease-out backwards}
.stars svg:nth-child(2){animation-delay:.15s;width:56px;height:56px}
.stars svg:nth-child(3){animation-delay:.3s}
.form{display:flex;gap:8px;width:100%}
.form input{flex:1;min-width:0;font-family:var(--letter);font-weight:700;font-size:24px;text-transform:uppercase;padding:8px 12px;border:3px solid var(--ink);border-radius:14px;color:var(--ink);background:#fff}
.nlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.nlist .chip{display:flex;align-items:center;gap:6px}
.hint{margin:0;font-family:var(--letter);font-size:15px;line-height:1.35;color:rgba(59,42,74,.75)}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}
.spk{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none;z-index:50;animation:spk .75s ease-out forwards}
.spk svg{width:100%;height:100%;display:block}

/* phone landscape */
@media (orientation:landscape) and (max-height:560px){
  .hero{flex-direction:row;gap:16px}
  .uni{flex:1 1 40%;max-height:none;height:100%;min-height:0}
  .side{flex:1 1 60%;gap:10px}
  h1{font-size:clamp(20px,5vh,40px)}
  .big{padding:8px}
  #paint{flex-direction:row}
  #paint .topbar{flex-direction:column;min-height:0;width:46px}
  #paint .palette{display:grid;grid-auto-flow:column;grid-template-rows:repeat(8,minmax(0,1fr));gap:6px;margin:0;max-width:none;align-self:stretch;padding:4px 6px 4px 0}
  #paint .palette .sw{width:auto;height:100%;max-height:40px;aspect-ratio:1}
  #paint .tool.last{margin-right:0}
  .acts{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);max-height:240px}
  .pics{max-width:none}
  .pic{height:100%;width:auto;justify-self:center}
}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-34px) scale(1.04) rotate(-4deg)}60%{transform:translateY(0) scale(1.05,.95)}100%{transform:translateY(0) scale(1)}}
@keyframes twk{0%,100%{transform:scale(.4) rotate(0);opacity:.2}50%{transform:scale(1.1) rotate(40deg);opacity:1}}
@keyframes spk{from{transform:translate(0,0) scale(.4) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg);opacity:0}}
@keyframes snap{0%{filter:brightness(1.6)}100%{filter:brightness(1)}}
@keyframes glow{50%{box-shadow:0 8px 0 3px var(--ink),0 0 0 14px rgba(255,210,63,.8)}}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){
  .uni svg.art,.twk,.uni.hop svg.art{animation:none}
  .spk{animation-duration:.01s}
  .shake{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <!-- HOME -->
  <section id="home" class="screen">
    <div class="topbar"><span class="grow"></span><button class="btn fsbtn" aria-label="Tela cheia"></button><button class="btn" id="mute" aria-label="Som"></button></div>
    <div class="hero">
      <button class="uni" id="uni" aria-label="Unicórnio mágico">
        <svg class="twk" style="left:12%;top:12%" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>
        <svg class="twk" style="right:14%;top:4%" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>
        <svg class="twk" style="right:20%;bottom:16%" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>
        <span id="uniArt" style="height:100%;display:flex;justify-content:center"></span>
      </button>
      <div class="side">
        <h1><span class="name" id="heroName">Rafaela</span><span class="sub">e o Unicórnio Mágico</span></h1>
        <div class="players" id="players"></div>
        <div class="choices">
          <button class="big paint" id="goPaint">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2.5 7 2.5 12s4 9 8.5 9c1.5 0 2-1 2-2 0-1.4-1-1.6-1-3 0-1.2 1-2 2.5-2H17c2.5 0 4.5-2 4.5-4.5C21.5 5.8 17.5 3 12 3z" fill="#fff" stroke="#3B2A4A" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7" cy="11" r="1.7" fill="#FF4D6D"/><circle cx="9.8" cy="6.8" r="1.7" fill="#5BC0EB"/><circle cx="14.6" cy="6.4" r="1.7" fill="#2FBF71"/><circle cx="18" cy="9.6" r="1.7" fill="#9B6BFF"/></svg>
            Colorir
          </button>

const attrs=a=>Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(' ');
function renderItems(items,fillFn,mode,k){
  k=k||1;let out='';
  for(const it of items){
    if(it.g){out+=`<g transform="${it.g}">${renderItems(it.items,fillFn,mode,k*it.k)}</g>`;continue}
    if(it.deco){
      if(mode==='lines'&&it.u)continue;
      const a=Object.assign({fill:'none',stroke:INK,'stroke-width':3,'stroke-linecap':'round','stroke-linejoin':'round'},it.a);
      a['stroke-width']=f2(a['stroke-width']/k);
      out+=`<${it.tag} class="dc" ${attrs(a)}/>`;continue;
    }
    const sw=f2(3/k);
    if(mode==='lines')out+=`<${it.tag} ${attrs(it.a)} fill="none" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/>`;
    else out+=`<${it.tag} ${attrs(it.a)} fill="${fillVal(fillFn(it))}" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"${mode==='edit'?` class="rg" data-id="${it.id}"`:''}/>`;
  }
  return out;
}

function tone(f,t0,dur,type,vol,fEnd){

  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

const SPK=['#FFD23F','#FF5FA2','#5BC0EB','#9B6BFF','#8CE99A'];
function sparkle(x,y,n){
  n=reduce?2:(n||6);
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='spk';
    const a=Math.random()*Math.PI*2,d=28+Math.random()*44;
    s.style.left=x+'px';s.style.top=y+'px';s.style.color=SPK[i%SPK.length];
    s.style.setProperty('--dx',(Math.cos(a)*d).toFixed(0)+'px');s.style.setProperty('--dy',(Math.sin(a)*d).toFixed(0)+'px');
    s.innerHTML=STAR;document.body.appendChild(s);setTimeout(()=>s.remove(),820);
  }
}
function sparkleAt(el,n){const r=el.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2,n)}
const fx=$('fx'),ctx=fx.getContext('2d');
function confetti(){
  if(reduce)return;
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;
  fx.width=W*dpr;fx.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2.5,vy:2+Math.random()*3,
    r:5+Math.random()*7,a:Math.random()*6,va:(Math.random()-.5)*.25,c:SPK[(Math.random()*SPK.length)|0],k:(Math.random()*3)|0}));
  const t0=performance.now();
  (function frame(t){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.a+=p.va;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;
      if(p.k===0){ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2)}
      else if(p.k===1){ctx.beginPath();ctx.arc(0,0,p.r/2.4,0,7);ctx.fill()}
      else{ctx.beginPath();for(let i=0;i<10;i++){const q=i%2?p.r*.22:p.r*.55,an=-Math.PI/2+i*Math.PI/5;ctx.lineTo(q*Math.cos(an),q*Math.sin(an))}ctx.fill()}
      ctx.restore()});
    if(t-t0<3600)requestAnimationFrame(frame);else ctx.clearRect(0,0,W,H);
  })(t0);
}

const ptrs=new Map();let gest=null,stroke=null;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

host.addEventListener('pointerdown',e=>{
  e.preventDefault();

  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    gest={mode:'pending',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};
    if(state.tool==='brush')startStroke(e.clientX,e.clientY);
  }else if(ptrs.size===2){
    cancelStroke();
    const [a,b]=[...ptrs.values()];
    gest={mode:'pinch',d:Math.max(10,dist(a,b)),m:mid(a,b),v:{x:view.x,y:view.y,w:view.w}};
  }

host.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||!gest)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=host.getBoundingClientRect();
  if(gest.mode==='pinch'&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()],m=mid(a,b);
    const nw=clamp(gest.v.w/(dist(a,b)/gest.d),MINW,400),nh=nw*.75;
    const px=gest.v.x+(gest.m.x-r.left)/r.width*gest.v.w,py=gest.v.y+(gest.m.y-r.top)/r.height*gest.v.w*.75;
    view.w=nw;view.h=nh;view.x=px-(m.x-r.left)/r.width*nw;view.y=py-(m.y-r.top)/r.height*nh;clampView();applyView();
    return;
  }

  if(gest.mode==='pending'&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>10)gest.mode=view.w<399.9?'pan':'moved';
  if(gest.mode==='pan'){
    view.x=gest.vx-(e.clientX-gest.sx)/r.width*view.w;view.y=gest.vy-(e.clientY-gest.sy)/r.height*view.h;clampView();applyView();

function fillAt(cx,cy){
  const el=document.elementFromPoint(cx,cy),rg=el&&el.closest&&el.closest('.rg');if(!rg)return;
  const id=rg.dataset.id,f=fillsOf(state.scene),prev=f[id],c=state.color;

  const r=tInk.getBoundingClientRect(),evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  ictx.beginPath();ictx.moveTo(tDraw.last.x,tDraw.last.y);
  evs.forEach(ev=>{const p={x:(ev.clientX-r.left)*tr.dpr,y:(ev.clientY-r.top)*tr.dpr};ictx.lineTo(p.x,p.y);tDraw.last=p});ictx.stroke();
});
const tUp=e=>{if(!tDraw||e.pointerId!==tDraw.id)return;tDraw=null;checkTrace()};
tInk.addEventListener('pointerup',tUp);tInk.addEventListener('pointercancel',tUp);
function traceScore(){
  const c=document.createElement('canvas');c.width=tr.sw;c.height=tr.shh;const x=c.getContext('2d');x.drawImage(tInk,0,0,tr.sw,tr.shh);
  const ink=x.getImageData(0,0,tr.sw,tr.shh).data;let m=0,hit=0,ic=0,out=0;
  for(let i=3;i<ink.length;i+=4){const a=ink[i]>60,mm=tr.mask[i]>100,dd=tr.dil[i]>60;if(mm){m++;if(a)hit++}if(a){ic++;if(!dd)out++}}
  return {cov:m?hit/m:0,out:ic?out/ic:0};
}
function checkTrace(){const s=traceScore();if(s.cov>=.5&&s.out<=.4)letterDone()}
function letterDone(){
  tr.busy=true;drawGuide(true);sfx.snap();sparkleAt(tBox,9);say(letterName(tr.letters[tr.i]));
  setTimeout(()=>{tr.i++;tr.busy=false;renderTBar();
    if(tr.i>=tr.letters.length){const n=curName();sfx.win();confetti();say(n.toLowerCase(),200);
      showWin({title:'Muito bem!',word:n,again(){tr.i=0;renderTBar();drawGuide()},next(){history.back()}});return}
    drawGuide();say(letterName(tr.letters[tr.i]),150)},900);
}
$('tSay').onclick=()=>say(letterName(tr.letters[tr.i]||''));
$('tClear').onclick=()=>{sfx.click();ictx.setTransform(1,0,0,1,0,0);ictx.clearRect(0,0,tInk.width,tInk.height)};
$('tSkip').onclick=()=>{if(!tr.busy&&tr.i<tr.letters.length)letterDone()};
if('ResizeObserver' in window)new ResizeObserver(()=>{if(current==='trace'&&!tr.busy){sizeTrace();drawGuide()}}).observe(tBox);

/* ---------- letters: spell ---------- */
const spl={letters:[],i:0};
onShow.spell=()=>newSpell(true);
function newSpell(speak){
  spl.letters=charsOf(curName());spl.i=0;
  const sb=$('sSlots');sb.innerHTML='';
  spl.letters.forEach((l,i)=>{const s=document.createElement('span');s.className='slot'+(i===0?' next':'');s.textContent=l;sb.appendChild(s)});
  const tb=$('sTiles');tb.innerHTML='';
  shuffle(spl.letters.map(l=>l)).forEach((l,i)=>{const b=document.createElement('button');b.className='tile';b.textContent=l;
    b.style.background=['#FFE066','#9AD8FF','#B2F2BB','#FFC9DE','#D0BFFF','#FFD8A8'][i%6];b.setAttribute('aria-label',l);
    b.onclick=()=>tapTile(b,l);tb.appendChild(b)});
  if(speak)say(curName().toLowerCase(),300);
}
function tapTile(b,l){
  if(spl.i>=spl.letters.length)return;
  if(l===spl.letters[spl.i]){
    const slots=$('sSlots').children;slots[spl.i].classList.remove('next');slots[spl.i].classList.add('f');
    b.classList.add('gone');sfx.snap();sparkleAt(slots[spl.i],5);say(letterName(l));spl.i++;
    if(spl.i<spl.letters.length)slots[spl.i].classList.add('next');
    else{const n=curName();setTimeout(()=>{sfx.win();confetti();say(n.toLowerCase())},500);
      showWin({title:'Muito bem!',word:n,delay:1300,again:()=>newSpell(false),next(){history.back()}})}
  }else{sfx.wrong();shakeEl(b)}
}
$('sSay').onclick=()=>say(curName().toLowerCase());
$('sAgain').onclick=()=>{sfx.click();newSpell(false)};

/* ---------- letters: read + first letter ---------- */
const WORDS=[
  {w:'BOLA',s:['BO','LA'],o:'ball'},{w:'CASA',s:['CA','SA'],o:'house'},{w:'GATO',s:['GA','TO'],o:'cat'},{w:'PATO',s:['PA','TO'],o:'duck'},
  {w:'PEIXE',s:['PEI','XE'],o:'fish'},{w:'SOL',s:['SOL'],o:'sun'},{w:'LUA',s:['LU','A'],o:'moon'},{w:'FLOR',s:['FLOR'],o:'flower'},
  {w:'UVA',s:['U','VA'],o:'grapes'},{w:'BOLO',s:['BO','LO'],o:'cake'},{w:'DADO',s:['DA','DO'],o:'dice'},{w:'PIPA',s:['PI','PA'],o:'kite'},
  {w:'CARRO',s:['CAR','RO'],o:'car'},{w:'BARCO',s:['BAR','CO'],o:'boat'},{w:'ÁRVORE',s:['ÁR','VO','RE'],o:'tree'},{w:'FOGUETE',s:['FO','GUE','TE'],o:'rocket'},
  {w:'ESTRELA',s:['ES','TRE','LA'],o:'star'},{w:'CORAÇÃO',s:['CO','RA','ÇÃO'],o:'heart'},{w:'TREM',s:['TREM'],o:'train'}
];
const ROUND=5;
function renderProg(id,n){$(id).innerHTML=Array.from({length:ROUND},(_,i)=>STAR.replace('<svg ',`<svg class="${i<n?'on':''}" `)).join('')}
function nextWord(last){let w;do{w=pick(WORDS)}while(last&&w===last);return w}
const rd={score:0,w:null,lock:false};
onShow.read=()=>{rd.score=0;renderProg('rProg',0);newRead()};
function newRead(){
  rd.w=nextWord(rd.w);rd.lock=false;
  $('rWord').innerHTML=rd.w.s.map(x=>`<span class="syl">${x}</span>`).join('');
  const opts=shuffle([rd.w,...shuffle(WORDS.filter(x=>x!==rd.w)).slice(0,2)]);
  const box=$('rPics');box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('button');b.className='pic';b.setAttribute('aria-label',o.w.toLowerCase());
    b.innerHTML=`<img alt="" src="${iconURL(o.o)}">`;b.onclick=()=>chooseRead(b,o);box.appendChild(b)});
}
function chooseRead(b,o){
  if(rd.lock)return;
  if(o===rd.w){
    rd.lock=true;b.classList.add('right');sfx.snap();sparkleAt(b,8);say(o.w.toLowerCase());rd.score++;renderProg('rProg',rd.score);
    if(rd.score>=ROUND){setTimeout(()=>{sfx.win();confetti()},500);showWin({delay:1300,again(){onShow.read()},next(){onShow.read()}})}
    else setTimeout(newRead,1400);
  }else{b.classList.add('wrong');sfx.wrong();shakeEl(b)}
}
$('rSay').onclick=()=>rd.w&&say(rd.w.w.toLowerCase());

const fr={score:0,w:null,lock:false};
const ALPHA='ABCDEFGHIJLMNOPRSTUVXZ';
onShow.first=()=>{fr.score=0;renderProg('fProg',0);newFirst()};
const baseL=l=>l.normalize('NFD')[0];
function newFirst(){
  fr.w=nextWord(fr.w);fr.lock=false;
  const ch=charsOf(fr.w.w),first=baseL(ch[0]);
  $('fImg').src=iconURL(fr.w.o);
  $('fWord').innerHTML=`<span class="blank" id="fBlank">${ch[0]}</span>${ch.slice(1).join('')}`;
  const opts=shuffle([first,...shuffle([...ALPHA].filter(x=>x!==first)).slice(0,2)]);
  const box=$('fChoices');box.innerHTML='';
  opts.forEach(l=>{const b=document.createElement('button');b.className='lc';b.textContent=l;b.setAttribute('aria-label',l);b.onclick=()=>chooseFirst(b,l,first);box.appendChild(b)});
}
function chooseFirst(b,l,first){
  if(fr.lock)return;
  if(l===first){
    fr.lock=true;b.classList.add('right');$('fBlank').classList.add('ok');sfx.snap();sparkleAt(b,8);say(fr.w.w.toLowerCase());fr.score++;renderProg('fProg',fr.score);
    if(fr.score>=ROUND){setTimeout(()=>{sfx.win();confetti()},500);showWin({delay:1300,again(){onShow.first()},next(){onShow.first()}})}
    else setTimeout(newFirst,1500);
  }else{b.classList.add('wrong');sfx.wrong();shakeEl(b);say(letterName(l))}
}
$('fSay').onclick=()=>fr.w&&say(fr.w.w.toLowerCase());

/* expose for tests */
window.__game={state,SCENES,WORDS,traceScore,tr,sh,pz};
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
